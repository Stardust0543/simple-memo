<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="생각이 머무는 작은 공간. 나만의 웹 메모장.">
<meta name="referrer" content="no-referrer"><title>simple-memo · 나만의 메모장</title>
<style>
:root{color-scheme:light;--paper:#f5f4ee;--ink:#263a32;--muted:#6b746d;--line:#d9ded4;--accent:#335c47}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}button,input,textarea{font:inherit}button{cursor:pointer;min-height:46px;padding:10px 20px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:white;font-weight:600}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:wait}button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9dbaa7;outline-offset:3px}[hidden]{display:none!important}.wrap{max-width:1040px;padding:0 28px;margin:auto}header{padding:30px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:22px;font-weight:750;letter-spacing:-1px}.dot{display:inline-block;width:11px;height:11px;background:#7b9d77;border-radius:50%;margin-right:10px}.tag{font-size:12px;letter-spacing:2px;color:var(--muted)}main{padding:64px 0 40px}.intro small{letter-spacing:3px;color:var(--muted);font-size:11px}.intro h1{font-size:clamp(32px,5vw,48px);letter-spacing:-2px;line-height:1.25;margin:15px 0}.intro p{color:var(--muted);margin-bottom:34px}.auth-layout{display:grid;grid-template-columns:1fr 390px;gap:70px;align-items:start}.auth-panel{padding:30px;background:#fffef9;border:1px solid var(--line);border-radius:12px}.auth-panel h2{font-size:20px;margin:0 0 22px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:12px 14px}input{min-height:48px}textarea{resize:vertical;min-height:170px;line-height:1.75}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.hint{font-size:12px;color:var(--muted);margin:16px 0 0}.workspace{max-width:760px;margin:auto}.account{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.account span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.editor{padding:26px;background:#fffef9;border:1px solid var(--line);border-radius:10px}.editor label{margin:0 0 14px;font-size:18px}.editor-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}.editor-bottom small{font-size:12px;color:var(--muted)}.list-heading{display:flex;align-items:baseline;gap:12px;margin:38px 0 12px}.list-heading h2{font-size:20px;margin:0}.list-heading span{font-size:12px;color:var(--muted)}article{padding:24px 0;border-top:1px solid var(--line)}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 18px;font-size:16px}article .meta{display:flex;justify-content:space-between;align-items:center;gap:12px}time{font-size:12px;color:var(--muted)}.delete{min-height:40px;padding:6px 13px;background:transparent;color:#8b5143;border-color:#dccfc7;font-size:12px}.empty{padding:40px 0;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:14px}#status{min-height:27px;margin:22px auto 0;font-size:14px;color:var(--accent);max-width:760px}#status.error{color:#a23929}footer{padding:24px 0 32px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:1px;margin-top:50px}@media(max-width:700px){.wrap{padding:0 20px}header{padding:22px 0}.tag{display:none}main{padding:34px 0}.auth-layout{grid-template-columns:1fr;gap:12px}.auth-panel{padding:24px}.intro h1{font-size:36px}.intro p{margin-bottom:20px}.editor{padding:20px}.account{align-items:flex-start}.account button{flex-shrink:0}.editor-bottom{align-items:flex-end}}@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}}
.memo-image,#image-preview{display:block;max-width:100%;height:auto;max-height:600px;object-fit:contain;border-radius:8px;margin:0 0 18px;background:#fff}#image-preview{max-height:240px}.image-tools{margin:18px 0}.image-tools label{font-size:14px}.image-tools small{display:block;color:var(--muted);margin:8px 0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
</head>
<body><div class="wrap">
<header><div class="brand"><span class="dot"></span>simple-memo</div><span class="tag">A LITTLE SPACE FOR YOUR THOUGHTS</span></header>
<main>
<section id="auth-view" class="auth-layout">
<div class="intro"><small>YOUR PRIVATE NOTEBOOK</small><h1>생각은 가볍게,<br>기록은 오래.</h1><p>문득 떠오른 생각과 오늘의 할 일.<br>나만의 작은 메모장에 남겨 두세요.</p></div>
<form id="auth-form" class="auth-panel"><h2>나만의 메모장 열기</h2>
<label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="you@example.com">
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="8자 이상">
<div class="actions"><button id="login" type="submit">로그인</button><button id="signup" class="secondary" type="button">회원가입</button></div><p class="hint">처음이라면 회원가입을 눌러 주세요.<br>실습용 메모장으로, 이메일 확인 없이 바로 시작해요.</p></form>
</section>
<section id="memo-view" class="workspace" hidden>
<div class="account"><div><strong>나의 작은 기록들</strong><br><span id="account-email"></span></div><button id="logout" class="secondary" type="button">로그아웃</button></div>
<form id="memo-form" class="editor"><label for="memo">무엇을 남겨 볼까요?</label><textarea id="memo" required maxlength="10000" placeholder="지금 떠오르는 생각을 적어 보세요."></textarea><div class="image-tools"><label for="image-file">사진 첨부 (1장)</label><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"><small id="image-info">JPG·PNG·WebP · 자동 축소 및 압축</small><img id="image-preview" alt="첨부 사진 미리보기" hidden><button id="remove-image" type="button" class="secondary" hidden>첨부 취소</button></div><div class="editor-bottom"><small>나에게만 보이는 메모 · 최대 10,000자</small><button id="save" type="submit">메모 저장</button></div></form>
<div class="list-heading"><h2>메모 목록</h2><span id="count"></span></div><div id="notes" aria-live="polite"></div>
</section>
<p id="status" role="status" aria-live="polite">연결 중…</p>
</main><footer>simple-memo &nbsp; / &nbsp; 나만의 생각을 차곡차곡.</footer>
</div><script>
'use strict';
const $=id=>document.getElementById(id);
let client,session=null,loading=false,version=0;
let imageData=null,imageTask=0,imageBusy=false;
function clearImage(){imageTask++;imageBusy=false;imageData=null;$('image-file').value='';$('image-preview').hidden=true;$('image-preview').removeAttribute('src');$('remove-image').hidden=true;$('image-info').textContent='JPG·PNG·WebP · 자동 축소 및 압축';}
$('remove-image').onclick=clearImage;
$('image-file').onchange=async()=>{const file=$('image-file').files[0];clearImage();if(!file)return;const task=imageTask;imageBusy=true;try{if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>25*1024*1024)throw new Error('JPG·PNG·WebP 형식의 25MB 이하 사진을 선택해 주세요.');const bitmap=await createImageBitmap(file);try{let scale=Math.min(1,1280/Math.max(bitmap.width,bitmap.height));let blob;const canvas=document.createElement('canvas');for(let attempt=0;attempt<12;attempt++){canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',Math.max(.5,.8-attempt*.08)));if(blob&&blob.size<=200*1024)break;scale*=.8;}if(!blob||blob.size>200*1024)throw new Error('사진을 압축하지 못했어요. 다른 사진을 선택해 주세요.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});if(task!==imageTask)return;imageData=data;$('image-preview').src=data;$('image-preview').hidden=false;$('remove-image').hidden=false;$('image-info').textContent=canvas.width+' × '+canvas.height+' · '+Math.ceil(blob.size/1024)+'KB (원본 '+Math.ceil(file.size/1024)+'KB)';}finally{bitmap.close();}}catch(e){if(task===imageTask)status(e.message||'사진을 읽지 못했어요.',true);}finally{if(task===imageTask)imageBusy=false;}};
function status(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function message(error){const m=error?.message||'';if(m.includes('Invalid login'))return '이메일 또는 비밀번호를 확인해 주세요.';if(m.includes('already registered'))return '이미 가입된 이메일이에요. 로그인해 주세요.';if(m.includes('Email not confirmed'))return '이메일 확인이 필요해요.';if(m.includes('rate limit')||error?.status===429)return '요청이 많아요. 잠시 뒤 다시 시도해 주세요.';if(m.includes('fetch')||m.includes('network'))return '인터넷 연결을 확인하고 다시 시도해 주세요.';return '요청을 처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.';}
async function run(task){if(loading)return;loading=true;$('image-file').disabled=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await task();}catch(e){status(message(e),true);}finally{loading=false;$('image-file').disabled=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function applySession(next){const previous=session?.user.id;session=next;version++;$('auth-view').hidden=!!next;$('memo-view').hidden=!next;$('account-email').textContent=next?.user.email||'';if(previous!==next?.user.id){clearImage();$('notes').replaceChildren();$('count').textContent='';$('memo').value='';}if(!next)status('로그인하거나 가입해서 시작하세요.');}
async function list(){if(!session)return;const current=version;const owner=session.user.id;const all=[];let start=0;while(true){const {data,error}=await client.from('simple_memo_notes').select('id,content,created_at,image_data').eq('user_id',owner).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);if(error)throw error;if(current!==version)return;all.push(...data);if(data.length<500)break;start+=500;}if(current!==version)return;const frag=document.createDocumentFragment();for(const note of all){const article=document.createElement('article');const p=document.createElement('p');p.textContent=note.content;const meta=document.createElement('div');meta.className='meta';const time=document.createElement('time');time.dateTime=note.created_at;time.textContent=new Date(note.created_at).toLocaleString('ko-KR');const button=document.createElement('button');button.type='button';button.className='delete';button.textContent='삭제';button.setAttribute('aria-label','메모 삭제');button.disabled=loading;button.onclick=()=>run(async()=>{if(!session||session.user.id!==owner)return;const {error,data}=await client.from('simple_memo_notes').delete().eq('id',note.id).eq('user_id',owner).select('id');if(error)throw error;if(!data.length)throw new Error('not deleted');await list();status('메모를 삭제했어요.');});meta.append(time,button);if(note.image_data&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(note.image_data)){const img=document.createElement('img');img.className='memo-image';img.alt='메모에 첨부한 사진';img.loading='lazy';img.src=note.image_data;article.append(img);}article.append(p,meta);frag.append(article);}if(!all.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='아직 메모가 없어요. 첫 번째 기록을 남겨 보세요.';frag.append(empty);}$('notes').replaceChildren(frag);$('count').textContent=all.length+'개';}
async function authenticate(signup){if(!$('auth-form').reportValidity())return;await run(async()=>{status(signup?'가입 중…':'로그인 중…');const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await client.auth.signUp(credentials):await client.auth.signInWithPassword(credentials);if(error)throw error;$('password').value='';if(!data.session){status('가입 확인 이메일을 확인해 주세요.');return;}applySession(data.session);await list();status(signup?'가입 완료! 첫 메모를 남겨 보세요.':'다시 만나서 반가워요.');});}
$('auth-form').onsubmit=e=>{e.preventDefault();authenticate(false);};$('signup').onclick=()=>authenticate(true);
$('memo-form').onsubmit=e=>{e.preventDefault();if(imageBusy){status('사진 압축이 끝난 뒤 저장해 주세요.',true);return;}const content=$('memo').value.trim();if(!content){status('메모 내용을 입력해 주세요.',true);$('memo').focus();return;}run(async()=>{if(!session)throw new Error('no session');status('저장 중…');const {error}=await client.from('simple_memo_notes').insert({user_id:session.user.id,content,image_data:imageData});if(error)throw error;$('memo').value='';clearImage();await list();status('메모를 저장했어요.');});};
$('logout').onclick=()=>run(async()=>{const {error}=await client.auth.signOut();if(error)throw error;applySession(null);$('password').value='';status('로그아웃했어요.');});
(async()=>{try{if(!window.supabase)throw new Error('network');client=window.supabase.createClient('https://tcveqhdxcdkuxjyxvxva.supabase.co','sb_publishable_KlA5b6Bks1_dAdAhUGZ23Q_dgdQM_0P',{auth:{storageKey:'simple-memo-tcveqhdxcdkuxjyxvxva',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data,error}=await client.auth.getSession();if(error)throw error;applySession(data.session);if(session){await list();status('저장된 메모를 불러왔어요.');}client.auth.onAuthStateChange((event,next)=>{if(event==='SIGNED_OUT'){applySession(null);}else if(event==='TOKEN_REFRESHED'){session=next;}else if(event==='SIGNED_IN'&&next?.user.id!==session?.user.id){applySession(next);setTimeout(()=>list().catch(e=>status(message(e),true)),0);}});}catch(e){status(message(e),true);}})();
</script></body></html>
